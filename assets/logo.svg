<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Package icon: Yggdrasil in ember gold on a carved dark disc. Rendered to icon.png by tools/package.ps1. -->
  <defs>
    <radialGradient id="disc" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#3f3226"/>
      <stop offset="1" stop-color="#140f0b"/>
    </radialGradient>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="0" y1="40" x2="0" y2="225">
      <stop offset="0" stop-color="#ffe2a2"/>
      <stop offset="0.5" stop-color="#f2b24a"/>
      <stop offset="1" stop-color="#b8661e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="128" cy="128" r="122" fill="url(#disc)" stroke="#a9813f" stroke-width="8"/>
  <circle cx="128" cy="128" r="108" stroke="#5e4a2e" stroke-width="3"/>
  <g stroke="url(#gold)" filter="url(#glow)">
    <!-- trunk -->
    <path d="M128 196 V96" stroke-width="14"/>
    <!-- crown -->
    <path d="M128 112 C112 96 92 92 72 96 M128 112 C144 96 164 92 184 96" stroke-width="9"/>
    <path d="M128 100 C116 80 100 70 82 64 M128 100 C140 80 156 70 174 64" stroke-width="8"/>
    <path d="M128 96 V48" stroke-width="8"/>
    <path d="M90 95 C82 84 80 74 84 64 M166 95 C174 84 176 74 172 64" stroke-width="5"/>
    <!-- roots -->
    <path d="M128 190 C112 200 92 202 70 196 M128 190 C144 200 164 202 186 196" stroke-width="8"/>
    <path d="M128 194 C120 210 106 218 90 220 M128 194 C136 210 150 218 166 220" stroke-width="6"/>
  </g>
  <g fill="#f2b24a">
    <circle cx="72" cy="96" r="7"/><circle cx="184" cy="96" r="7"/>
    <circle cx="82" cy="64" r="7"/><circle cx="174" cy="64" r="7"/><circle cx="128" cy="46" r="8"/>
  </g>
</svg>
